# ============================================================================
# Drith — Jekyll config (GitHub Pages builds this automatically)
# ============================================================================

title:       Drith
tagline:     Siege and conquer
description: >-
  Drith — drop in, plant a base, and hold it. Survival, monuments, PvP and PvE
  on a world that never stops coming for you. 202X.
author:      WhitleyStriber
release:     "202X"

# --- Game server ------------------------------------------------------------
# The access code the PLAY button reveals. Leave it empty and the panel reads
# "Server offline" instead. A bare IP is fine — "203.0.113.24" — or add a port
# if players need one: "203.0.113.24:7777".
#
# NOTE: whatever goes here is published on a public page and will be crawled
# and cached. Use the address of the box you actually intend to expose.
server_ip: ""

# --- URLs -------------------------------------------------------------------
# Repo is WhitleyStriber/drith.github.io → a PROJECT site, so every path needs
# the /drith.github.io prefix (handled by the `relative_url` filter).
# Rename the repo to whitleystriber.github.io, or add a custom domain, and set
# baseurl to "".
url:     "https://whitleystriber.github.io"
baseurl: "/drith.github.io"

# --- Build ------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /devlog/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

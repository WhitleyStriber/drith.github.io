<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">

<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="theme-color" content="#07080b">
<meta name="twitter:card" content="summary_large_image">

<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }} devlog" href="{{ '/feed.xml' | relative_url }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/wardeck.css' | relative_url }}">
</head>

<body>
<div class="hud-frame" aria-hidden="true"></div>
<div class="hud-grain" aria-hidden="true"></div>

<div class="shell">

  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}">Drith<b>.dev</b></a>

    <div class="statusline" id="statusline" data-lines='[
      "network integrity 93% — holding",
      "sector 7 restricted — no reason given",
      "extraction nominal — crystal integrity 100%",
      "build target 202X — schedule under review",
      "seismic activity detected — geological in nature"
    ]'><span class="tick">■</span> booting wardeck…</div>

    <nav class="tabs" aria-label="Primary">
      {%- assign p = page.url -%}
      <a class="tab" href="{{ '/' | relative_url }}"{% if p == '/' %} aria-current="page"{% endif %}>Overview</a>
      <a class="tab" href="{{ '/devlog/' | relative_url }}"{% if p contains '/devlog' %} aria-current="page"{% endif %}>Devlog</a>
      <a class="tab" href="{{ '/lore/' | relative_url }}"{% if p contains '/lore' %} aria-current="page"{% endif %}>Lore</a>
    </nav>

    <span class="pill" title="Target release window"><i class="orb"></i>{{ site.release }}</span>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="foot-bar">
    <span>Drith — {{ site.release }} · built in the open</span>
    <nav class="foot-links">
      <a href="{{ '/devlog/' | relative_url }}">Devlog</a>
      <a href="{{ '/lore/' | relative_url }}">Lore</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      {%- if site.github_user %}<a href="https://github.com/{{ site.github_user }}">GitHub</a>{% endif -%}
    </nav>
    <span>&copy; <span id="year">2026</span> {{ site.author }}</span>
  </footer>

</div>

<script src="{{ '/assets/js/wardeck.js' | relative_url }}" defer></script>
</body>
</html>

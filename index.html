---
layout: default
description: >-
  Drith — siege and conquer. 202X.
---

<main class="stage">

  <canvas id="crystal" role="img" aria-label="Rotating Drith crystal"></canvas>

  <h1 class="wordmark">Dri<span>th</span></h1>
  <p class="tag">Siege and conquer &middot; <b>{{ site.release }}</b></p>

  <div class="cta">
    <button class="btn" id="play" aria-expanded="false" aria-controls="server">Play</button>
    <a class="btn ghost" href="{{ '/devlog/' | relative_url }}">Devlog</a>
  </div>

  <div class="server" id="server" hidden>
    {%- if site.server_ip and site.server_ip != "" %}
    <span class="label">Access code</span>
    <code id="addr">{{ site.server_ip }}</code>
    <button class="copy" id="copy">Copy</button>
    {%- else %}
    <span class="off">Server offline</span>
    {%- endif %}
  </div>

</main>

<script src="{{ '/assets/js/crystal.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>

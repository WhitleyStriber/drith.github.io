---
layout: default
title: Devlog
permalink: /devlog/
description: >-
  Build notes from Drith.
---

<div class="wrap">

  <div class="head">
    <a class="home" href="{{ '/' | relative_url }}">Drith</a>
    <span class="label">Devlog</span>
  </div>

  <div class="playbar">
    <button class="btn" id="play" aria-expanded="false" aria-controls="server">Play the beta</button>
  </div>
  {% include server.html %}

  {% if site.posts.size > 0 %}
  <div class="log">
    {%- for post in site.posts %}
    <a class="row" href="{{ post.url | relative_url }}">
      <span class="d">{{ post.date | date: "%Y.%m.%d" }}</span>
      <span class="t">{{ post.title }}</span>
    </a>
    {%- endfor %}
  </div>
  {% else %}
  <div class="empty">No entries yet</div>
  {% endif %}

</div>
